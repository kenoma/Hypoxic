apply plugin: 'com.android.application'

android {
    compileSdkVersion 23
    buildToolsVersion "21.1.2"

    defaultConfig {

        minSdkVersion 15
        targetSdkVersion 23
        versionCode 33
        versionName "1.3.5"

        productFlavors {
            free {
                applicationId "com.lanius.kenoma.free"
            }
            paid {
                applicationId "com.lanius.kenoma.pob"
            }
        }

    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
}

repositories {
    jcenter()
    maven { url 'https://repository-achartengine.forge.cloudbees.com/snapshot/' }
}

dependencies {
    compile fileTree(dir: 'libs', include: ['*.jar'])
    // You must install or update the Support Repository through the SDK manager to use this dependency.
    freeCompile 'com.google.android.gms:play-services:8.4.0'
    compile 'com.android.support:appcompat-v7:23+'
    compile 'org.achartengine:achartengine:1.2.0'
    compile 'com.android.support:support-v4:23+'
    compile(group: 'com.albertcbraun.cms50fwlib', name: 'cms50fwlib', version: '0.5.1')
}
